<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>成语故事ノート</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#C8412F"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="成语故事">

<style>
:root{--bg:#F3F5F8;--surface:#FFFFFF;--surface2:#EDF1F6;--ink:#1B2433;--muted:#5E6A7D;--line:#D9DFE8;--acc:#C8412F;--indigo:#2E5A88;--mark:#FBE3B8;--good:#2E7D4F;--gold:#D99A2B;--story:#FBF7EE}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#11151C;--surface:#1A2029;--surface2:#222A35;--ink:#E6EAF1;--muted:#98A3B5;--line:#2E3746;--acc:#EE7461;--indigo:#86AEDB;--mark:#5A4520;--good:#6CC18E;--gold:#E5B458;--story:#211F1A}}
:root[data-theme=dark]{--bg:#11151C;--surface:#1A2029;--surface2:#222A35;--ink:#E6EAF1;--muted:#98A3B5;--line:#2E3746;--acc:#EE7461;--indigo:#86AEDB;--mark:#5A4520;--good:#6CC18E;--gold:#E5B458;--story:#211F1A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;font-size:15.5px;line-height:1.7}
.zh,[lang=zh-CN]{font-family:"Noto Serif SC","Songti SC","Noto Serif CJK SC","PingFang SC",serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
header{position:fixed;top:0;left:0;right:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hin{max-width:760px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:8px}
.htitle{font-weight:700;font-size:17px;flex:1;white-space:nowrap}
.htitle .zh{color:var(--acc)}
.tg{font-size:12px;border:1px solid var(--line);border-radius:14px;padding:3px 10px;color:var(--muted);white-space:nowrap}
.tg.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
main{max-width:760px;margin:0 auto;padding:calc(58px + env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tin{max-width:760px;margin:0 auto;display:flex}
.tab{flex:1;padding:7px 0 6px;text-align:center;color:var(--muted);font-size:11px;line-height:1.3}
.tab .zh{display:block;font-size:20px;font-weight:700}
.tab.on{color:var(--acc)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.search{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);margin-bottom:10px}
.seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.seg button{flex:1;min-width:80px;padding:8px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px;color:var(--muted);line-height:1.35}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.chbar{background:var(--indigo);color:#fff;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.chbar .n{font-size:12px;letter-spacing:.15em;opacity:.85}
.chbar .t{font-size:17px;font-weight:700;line-height:1.4}
.chbar .s{font-size:12.5px;opacity:.9;margin-top:2px}
.chbar button{margin-top:8px;font-size:13px;border:1px solid rgba(255,255,255,.6);border-radius:14px;padding:3px 12px;color:#fff}
.gh{font-size:13px;font-weight:700;color:var(--acc);margin:16px 2px 6px}
.gh small{color:var(--muted);font-weight:400;margin-left:6px}
.gd{font-size:12px;color:var(--muted);margin:-4px 2px 8px}
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px;width:100%;text-align:left}
.row .no{flex:0 0 30px;height:30px;border-radius:6px;background:var(--acc);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.row .mid{flex:1;min-width:0}
.row .pat{font-size:21px;font-weight:700;letter-spacing:.06em;line-height:1.3}
.row .mean{font-size:12.5px;color:var(--muted);line-height:1.45}
.stars{color:var(--gold);font-size:11px;letter-spacing:.05em}.stars i{color:var(--line);font-style:normal}
.fav{font-size:22px;color:var(--line);padding:4px 2px;line-height:1}.fav.on{color:var(--gold)}
.where{font-size:12px;color:var(--indigo);font-weight:700;margin:2px 0 8px;display:flex;justify-content:space-between;gap:8px}
.dhead{display:flex;gap:12px;align-items:stretch;border-bottom:2px solid var(--ink);padding-bottom:8px}
.dno{flex:0 0 44px;background:var(--acc);color:#fff;border-radius:6px;font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center}
.dgroup{font-size:12px;color:var(--acc);font-weight:700}
.dpat{font-size:32px;font-weight:700;letter-spacing:.08em;line-height:1.25}
.dpy{font-size:13.5px;color:var(--muted)}
.dmean{font-size:16.5px;font-weight:700;background:var(--surface2);border-left:4px solid var(--gold);padding:8px 12px;margin:12px 0 4px;border-radius:0 6px 6px 0;line-height:1.55}
.tone{display:inline-block;font-size:11px;color:#fff;border-radius:10px;padding:0 9px;margin-right:8px;vertical-align:2px;font-weight:700}
.tone.t褒{background:var(--good)}.tone.t贬{background:var(--acc)}.tone.t中{background:#7a8296}
.djp{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.bt{font-size:12px;font-weight:700;color:var(--indigo);letter-spacing:.1em;margin-bottom:6px}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kc{flex:1;min-width:70px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 4px;background:var(--surface2)}
.kch{font-size:27px;font-weight:700;line-height:1.2}.kpy{font-size:12px;color:var(--acc)}.km{font-size:11.5px;color:var(--muted);line-height:1.35}
.ksum{margin-top:8px;font-size:13.5px}.ksum b{color:var(--indigo);font-size:15px}
.story{background:var(--story);border-left:4px solid var(--acc)}
.story .bt{color:var(--acc)}
.src{font-size:12px;color:var(--muted);margin-bottom:8px}
.story p{margin:0 0 10px;text-indent:1em;line-height:1.95;font-size:15.5px}
.story b{color:var(--acc)}
.sec{display:inline-block;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:700;border-radius:4px;padding:1px 10px;margin:14px 0 8px}
ul.pl{margin:0;padding-left:20px}ul.pl li{margin:3px 0}
.ex{border-bottom:1px dashed var(--line);padding:8px 0;display:flex;gap:8px;align-items:flex-start}
.ex:last-child{border-bottom:0}
.ex .body{flex:1;min-width:0}
.exzh{font-size:20px;line-height:2.25}
ruby{ruby-position:over}
rt{font-family:"Zen Kaku Gothic New",sans-serif;font-size:10.5px;color:var(--muted);font-weight:400;letter-spacing:0}
.hl{color:var(--acc);font-weight:700;background:linear-gradient(transparent 62%,var(--mark) 62%)}
.hl rt{color:var(--acc)}
body.nopy rt{display:none}body.nopy .exzh{line-height:1.8}
.ja{font-size:13.5px;color:var(--muted);line-height:1.6}
body.hideja .ja:not(.show){filter:blur(6px);cursor:pointer;user-select:none}
.spk{flex:0 0 34px;height:34px;border-radius:50%;border:1px solid var(--line);color:var(--indigo);font-size:15px;margin-top:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
th{background:var(--surface2);font-weight:700}
.cmp th{width:36%;font-size:16px}.cmp th small,.cpy{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:11px;color:var(--muted);font-weight:400}
.tip{background:var(--mark);border-radius:8px;padding:9px 12px;margin-top:14px;font-size:14px;color:var(--ink)}
.tip span{background:var(--gold);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 9px;margin-right:8px}
.chend{margin-top:18px;border:2px solid var(--indigo);border-radius:10px;padding:14px;text-align:center}
.chend .m{font-weight:700;color:var(--indigo);margin-bottom:10px}
.btn{display:inline-block;border-radius:10px;padding:9px 16px;font-weight:700;font-size:14px;background:var(--acc);color:#fff;margin:4px}
.btn.sub{background:var(--surface);color:var(--indigo);border:1px solid var(--indigo)}
.pn{display:flex;gap:8px;margin-top:18px}
.pn button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 4px;font-size:13.5px;color:var(--indigo);font-weight:700}
.pn button:disabled{opacity:.35}
h2.pt{font-size:18px;margin:4px 0 10px;border-bottom:2px solid var(--acc);padding-bottom:4px}
h3.ps{font-size:15px;color:var(--indigo);margin:18px 0 8px}
.rule{display:flex;gap:10px;background:var(--surface2);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:14px}
.rule i{flex:0 0 24px;height:24px;border-radius:50%;background:var(--indigo);color:#fff;text-align:center;line-height:24px;font-style:normal;font-weight:700;font-size:13px}
.pair{border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:8px;background:var(--surface);font-size:14px}
.pair .h{font-size:18px;font-weight:700}.pair .h a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--muted)}.pair .h span{font-size:12px;color:var(--muted);margin:0 8px;font-weight:400}
.qrow td:first-child{width:30px;color:var(--muted);font-size:12px}.qrow{cursor:pointer}.qp{font-size:17px;font-weight:700;white-space:nowrap}
.qcard .hint{font-size:14.5px;color:var(--muted);margin-bottom:8px}
.qcard .qzh{font-size:21px;line-height:1.8}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--acc);text-align:center;color:var(--acc);font-weight:700}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-top:8px;background:var(--surface);font-size:21px;font-weight:700;letter-spacing:.06em}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface));color:var(--good)}
.opt.ng{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surface));color:var(--acc)}
.prog{font-size:12.5px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.res{font-size:40px;font-weight:700;color:var(--acc);text-align:center}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.note{font-size:12.5px;color:var(--muted)}
</style>
</head>

<script>
const D={"title_zh":"成语故事","chaps":[{"n":1,"title":"歴史の物語から生まれた成語","zh":"历史故事","sub":"春秋・戦国から宋の時代まで、実在の人物と事件の話","groups":[{"id":"shunju","ja":"春秋・戦国時代","zh":"春秋战国","desc":"紀元前770〜前221年。多くの国が争った時代で、成語の宝庫"},{"id":"qinhan","ja":"秦・漢の時代","zh":"秦汉","desc":"始皇帝の統一から、項羽と劉邦の戦い、漢の時代まで"},{"id":"sanguo","ja":"三国時代","zh":"三国","desc":"魏・呉・蜀が争った時代。『三国演義』で誰もが知る話"},{"id":"jin","ja":"晋から宋の時代","zh":"晋到宋","desc":"書・絵・学問・科挙など、文化人の話が多い"}],"items":[{"id":"woxin","g":"shunju","stars":2,"tone":"褒","pat":"卧薪尝胆","py":"wò xīn cháng dǎn","mean":"目的のために、長いあいだ苦労にたえて努力する","jp":"臥薪嘗胆（がしんしょうたん）","chars":[{"w":"卧薪尝胆","cs":[["卧","wò","横になる・寝る"],["薪","xīn","たきぎ"],["尝","cháng","なめる・味わう"],["胆","dǎn","きも（とても苦い）"]],"sum":"たきぎの上に寝て、苦いきもをなめる"}],"src":"春秋時代末（前5世紀）｜『史記』越王勾践世家ほか","story":["春秋時代の終わり、南方の<b>越（えつ）<\/b>の王・勾践（こうせん）は、となりの<b>呉（ご）<\/b>の王・夫差（ふさ）との戦いに負けました。勾践は命を助けてもらうかわりに呉へ行き、夫差の馬の世話をする召使いとして3年間働かされました。","国に帰ることを許された勾践は、このくやしさを忘れないと決めます。やわらかい布団をやめて<b>かたいたきぎの上で寝て<\/b>、部屋に<b>苦いきもをつるし、食事のたびになめて<\/b>「お前は負けた恥を忘れたのか」と自分に言い聞かせました。自分で畑を耕し、民と同じものを食べ、国を少しずつ強くしていきました。","約20年後、越はついに呉をほろぼし、夫差は自殺しました。"],"use":["<b>ほめ言葉<\/b>。失敗やくやしさをばねに、長い時間をかけて努力する人・チームに使う。","文の中では動詞のように使う：「卧薪尝胆三年」「卧薪尝胆的精神」。","1日や1週間の短い努力には使わない。「長いあいだ」がポイント。"],"ex":[{"t":[["他","tā",0],["卧","wò",1],["薪","xīn",1],["尝","cháng",1],["胆","dǎn",1],["三","sān",0],["年","nián",0],["，","",0],["终","zhōng",0],["于","yú",0],["考","kǎo",0],["上","shàng",0],["了","le",0],["理","lǐ",0],["想","xiǎng",0],["的","de",0],["大","dà",0],["学","xué",0],["。","",0]],"ja":"彼は三年間苦労にたえて努力し、ついに志望の大学に合格した。","plain":"他卧薪尝胆三年，终于考上了理想的大学。"},{"t":[["上","shàng",0],["次","cì",0],["比","bǐ",0],["赛","sài",0],["输","shū",0],["了","le",0],["以","yǐ",0],["后","hòu",0],["，","",0],["球","qiú",0],["队","duì",0],["卧","wò",1],["薪","xīn",1],["尝","cháng",1],["胆","dǎn",1],["，","",0],["今","jīn",0],["年","nián",0],["拿","ná",0],["到","dào",0],["了","le",0],["冠","guàn",0],["军","jūn",0],["。","",0]],"ja":"前回の試合に負けてから、チームはくやしさをばねに努力を重ね、今年優勝した。","plain":"上次比赛输了以后，球队卧薪尝胆，今年拿到了冠军。"},{"t":[["公","gōng",0],["司","sī",0],["需","xū",0],["要","yào",0],["卧","wò",1],["薪","xīn",1],["尝","cháng",1],["胆","dǎn",1],["的","de",0],["精","jīng",0],["神","shén",0],["，","",0],["才","cái",0],["能","néng",0],["重","chóng",0],["新","xīn",0],["站","zhàn",0],["起","qǐ",0],["来","lai",0],["。","",0]],"ja":"会社には臥薪嘗胆の精神があってこそ、立ち直ることができる。","plain":"公司需要卧薪尝胆的精神，才能重新站起来。"}],"cmp":[["闻鸡起舞","wén jī qǐ wǔ","毎日早くから努力する。くやしさ・復讐の気持ちは入らない"],["东山再起","Dōng Shān zài qǐ","失敗のあと「もう一度成功する」結果のほうを言う"]],"note":["日本では「臥薪」は夫差、「嘗胆」は勾践の話とされることが多いが、中国では<b>両方とも勾践の話<\/b>として語られる。『史記』にあるのは「尝胆」だけで、「卧薪」は後の時代に加わった。"],"tip":"「薪（たきぎ）で体が痛い＋胆（きも）で口が苦い」＝体も口も苦しい。くやしさを毎日思い出す工夫。","no":1,"ch":1},{"id":"laoma","g":"shunju","stars":2,"tone":"褒","pat":"老马识途","py":"lǎo mǎ shí tú","mean":"経験の多い人は、物事のやり方をよく知っている","jp":"老馬の智（ろうばのち）","chars":[{"w":"老马识途","cs":[["老","lǎo","年をとった"],["马","mǎ","馬"],["识","shí","知っている・見分ける"],["途","tú","道"]],"sum":"年をとった馬は道を知っている"}],"src":"春秋時代（前7世紀）｜『韓非子』説林上","story":["春秋時代、<b>斉（せい）<\/b>の桓公（かんこう）は、名宰相の<b>管仲（かんちゅう）<\/b>とともに北方の孤竹（こちく）国を攻めました。出発したのは春でしたが、帰るころには冬になっていました。景色がすっかり変わり、軍は山の中で道に迷ってしまいます。","みんなが困っていると、管仲が言いました。「<b>年をとった馬の知恵が使えます<\/b>。」何頭かの老馬を放して自由に歩かせ、軍はその後ろをついて行きました。すると老馬は来た道をちゃんと覚えていて、軍は無事に国へ帰ることができました。","賢い管仲でさえ、分からないときは馬に学んだ、という話です。"],"use":["<b>ほめ言葉<\/b>。ベテランの経験を尊重するときに使う。","文の最後に「老马识途嘛」（ベテランだからね）と添える使い方が多い。","自分のことを言うと自慢になるので、ふつうは他の人に使う。"],"ex":[{"t":[["这","zhè",0],["条","tiáo",0],["山","shān",0],["路","lù",0],["很","hěn",0],["复","fù",0],["杂","zá",0],["，","",0],["还","hái",0],["是","shi",0],["请","qǐng",0],["王","wáng",0],["师","shī",0],["傅","fu",0],["带","dài",0],["路","lù",0],["吧","ba",0],["，","",0],["老","lǎo",1],["马","mǎ",1],["识","shí",1],["途","tú",1],["嘛","ma",0],["。","",0]],"ja":"この山道は複雑だから、やはり王さんに道案内をお願いしよう。ベテランは道を知っているからね。","plain":"这条山路很复杂，还是请王师傅带路吧，老马识途嘛。"},{"t":[["他","tā",0],["在","zài",0],["这","zhè",0],["个","ge",0],["行","háng",0],["业","yè",0],["干","gàn",0],["了","le",0],["三","sān",0],["十","shí",0],["年","nián",0],["，","",0],["老","lǎo",1],["马","mǎ",1],["识","shí",1],["途","tú",1],["，","",0],["有","yǒu",0],["问","wèn",0],["题","tí",0],["可","kě",0],[ 璧を持たせ、うら道からこっそり趙へ帰らせました。璧は無事に趙に戻り、秦王も相如を殺すことはできませんでした。"],"use":["<b>ほめ言葉<\/b>。借りた本、落とし物などを「そのままの状態で返す」ときに使う。","「一定完璧归赵」（かならずお返しします）は、物を借りるときの決まり文句。少しユーモラスで上品。","人を帰すときには使わない。物だけ。"],"ex":[{"t":[["你","nǐ",0],["借","jiè",0],["给","gěi",0],["我","wǒ",0],["的","de",0],["词","cí",0],["典","diǎn",0],["，","",0],["我","wǒ",0],["明","míng",0],["天","tiān",0],["一","yí",0],["定","dìng",0],["完","wán",1],["璧","bì",1],["归","guī",1],["赵","zhào",1],["。","",0]],"ja":"あなたが貸してくれた辞書は、明日かならずそのままお返しします。","plain":"你借给我的词典，我明天一定完璧归赵。"},{"t":[["丢","diū",0],["了","le",0],["的","de",0],["钱","qián",0],["包","bāo",0],["被","bèi",0],["好","hǎo",0],["心","xīn",0],["人","rén",0],["捡","jiǎn",0],["到","dào",0],["，","",0],["最","zuì",0],["后","hòu",0],["完","wán",1],["璧","bì",1],["归","guī",1],["赵","zhào",1],["了","le",0],["。","",0]],"ja":"なくした財布は親切な人に拾われ、最後には無事に持ち主に戻った。","plain":"丢了的钱包被好心人捡到，最后完璧归赵了。"},{"t":[["这","zhè",0],["本","běn",0],["书","shū",0],["很","hěn",0],["珍","zhēn",0],["贵","guì",0],["，","",0],["看","kàn",0],["完","wán",0],["以","yǐ",0],["后","hòu",0],["请","qǐng",0],["完","wán",1],["璧","bì",1],["归","guī",1],["赵","zhào",1],["。","",0]],"ja":"この本はとても貴重なので、読み終わったらそのまま返してください。","plain":"这本书很珍贵，看完以后请完璧归赵。"}],"cmp":[["物归原主","wù guī yuán zhǔ","物が元の持ち主に戻る。「きずなく」の意味はない"],["负荆请罪","fù jīng qǐng zuì","同じ藺相如の物語の続き（次の項目）"]],"note":["日本語の「完璧」は「欠点がない」の意味だが、中国語で「欠点がない」は<b>完美 wánměi<\/b> と言う。「完璧」だけでは使わない。","璧（下が玉）を 壁（下が土、かべ）と書きまちがえやすい。"],"tip":"「璧」の下は「玉」。玉（たま）をきずなく返す。","no":5,"ch":1},{"id":"fujing","g":"shunju","stars":1,"tone":"褒","pat":"负荆请罪","py":"fù jīng qǐng zuì","mean":"自分のまちがいを認めて、自分から心をこめてあやまる","jp":"（刎頸の交わりの話）","chars":[{"w":"负荆请罪","cs":[["负","fù","背負う"],["荆","jīng","いばら（むちに使うとげのある木）"],["请","qǐng","願い出る"],["罪","zuì","罪・罰"]],"sum":"いばらのむちを背負って、罰を願い出る"}],"src":"戦国時代（前279年ごろ）｜『史記』廉頗藺相如列伝","story":["「完璧归赵」などの手柄で、藺相如（りんしょうじょ）は<b>趙<\/b>の大臣になり、歴戦の将軍・<b>廉頗（れんぱ）<\/b>より上の位になりました。廉頗は怒りました。「わしは命がけで戦ってきた。あいつは口がうまいだけだ。会ったら恥をかかせてやる。」","それを聞いた相如は、廉頗に会わないようにしました。道で廉頗の車を見ると、自分の車を横道にかくします。家来が「なさけない」と言うと、相如は答えました。「秦が趙を攻めないのは、<b>私たち二人がいるからだ。二匹の虎が争えば かりません。","そのとき、<b>毛遂（もうすい）<\/b>という男が進み出て「私を連れて行ってください」と言いました。平原君は言います。「すぐれた人は、袋の中のきり（錐）のように、すぐ先が外に出るものだ。あなたはここに3年いるが、うわさを聞いたことがない。」毛遂は答えました。「ですから<b>今日、私を袋に入れてください<\/b>。もっと早く入れてくだされば、先どころか全部つき出ていたでしょう。」","楚での話し合いは、朝から昼になっても決まりません。毛遂は剣に手をかけて階段をのぼり、楚王の前で堂々と利害を説きました。楚王はついに同盟を約束し、平原君は「毛先生の舌は百万の軍より強い」とほめました。"],"use":["<b>ほめ言葉<\/b>。自信と積極性をほめる。就職・役員えらび・ボランティアなどで使う。","「我来毛遂自荐一下」（自分から立候補します）と自分にも使える。","「自荐」だけでも「自己推薦」の意味（自荐信＝自己推薦の手紙）。"],"ex":[{"t":[["听","tīng",0],["说","shuō",0],["公","gōng",0],["司","sī",0],["需","xū",0],["要","yào",0],["会","huì",0],["日","rì",0],["语","yǔ",0],["的","de",0],["人","rén",0],["，","",0],["他","tā",0],["毛","máo",1],["遂","suì",1],["自","zì",1],["荐","jiàn",1],["，","",0],["得","dé",0],["到","dào",0],["了","le",0],["这","zhè",0],["个","ge",0],["机","jī",0],["会","huì",0],["。","",0]],"ja":"会社が日本語のできる人を必要としていると聞いて、彼は自分から名乗り出て、このチャンスを手に入れた。","plain":"听说公司需要会日语的人，他毛遂自荐，得到了这个机会。"},{"t":[["没","méi",0],["有","yǒu",0],["人","rén",0],["愿","yuàn",0],["意","yì",0],["当","dāng",0],["班","bān",0],["长","zhǎng",0],["，","",0],["小","xiǎo",0],["李","lǐ",0],["就","jiù",0],["毛","máo",1],["遂","suì",1],["自","zì",1],["荐","jiàn",1],["了","le",0],["。","",0]],"ja":"だれも学級委員になりたがらないので、李さんが自分から立候補した。","plain":"没有人愿意当班长，小李就毛遂自荐了。"},{"t":[["我","wǒ",0],["来","lái",0],["毛","máo",1],["遂","suì",1],["自","zì",1],["荐","jiàn",1],["一","yí",0],["下","xià",0],["，","",0],["这","zhè",0],["个","ge",0],["工","gōng",0],["作","zuò",0],["我","wǒ",0],["有","yǒu",0],["信","xìn",0],["心","xīn",0],["做","zuò",0],["好","hǎo",0],["。","",0]],"ja":"自分から立候補させてください。この仕事はうまくやる自信があります。","plain":"我来毛遂自荐一下，这个工作我有信心做好。"}],"cmp":[["自告奋勇","zì gào fèn yǒng","むずかしい・危ない仕事を自分から引き受ける。勇気に重点"],["脱颖而出","tuō yǐng ér chū","同じ話から生まれた成語。才能が外にあらわれ、目立つ"]],"note":["人の名前が入っているので、意味を字から推測できない成語。物語を知らないと分からない代表例。"],"tip":"「私を袋に入れてください」＝チャンスをくれれば、きりのように突き出てみせます。","no":8,"ch":1},{"id":"tuqiong","g":"shunju","stars":3,"tone":"贬","pat":"图穷匕见","py":"tú qióng bǐ xiàn","mean":"最後になって、かくしていた本当の目的があらわれる","jp":"（対応する四字熟語なし）","chars":[{"w":"图穷匕见","cs":[["图","tú","地図"],["穷","qióng","終わりになる・尽きる"],["匕","bǐ","短い刀（匕首）"],["见","xiàn","あらわれる（＝现）"]],"sum":"地図を広げ終わると、短刀があらわれる"}],"src":"戦国時代末（前227年）｜『戦国策』燕策・『史記』刺客列伝","story":["戦国時代の終わり、<b>秦<\/b>は次々に国をほろぼし、北の小国・<b>燕（えん）<\/b>にせまっていました。燕の太子・丹（たん）は、勇士の<b>荊軻（けいか）<\/b>に秦王・政（せい：後の<b>始皇帝<\/b>）の暗殺をたのみます。","秦王に近づくため、荊軻は二つのおくり物を用意しました。秦から逃げてきた将軍の首と、燕のゆたかな土地の地図です。そして、巻いた地図のいちばん奥に、毒をぬった短刀をかくしました。出発の日、人々は白い服で川辺まで見送り、荊軻は「一度行けば、もう帰らない」と歌いました。","秦の宮殿で、荊軻は地図をささげ、秦王がそれを少しずつ広げていきます。<b>地図が終わりまで開かれたとき、短刀があらわれました<\/b>。荊軻は王のそでをつかんで刺そうとしましたが、そでがちぎれて王は逃げ、柱のまわりを追いかけ合いになります。王はやっと長い剣をぬいて荊軻を切り、暗殺は失敗しました。"],"use":["<b>けなし言葉<\/b>。相手の悪いたくらみ・本当のねらいが最後にばれるときに使う。","やや書き言葉。ニュースや評論でよく見る。","よい計画が明らかになる場合には使わない。"],"ex":[{"t":[["谈","tán",0],["判","pàn",0],["到","dào",0],["了","le",0],["最","zuì",0],["后","hòu",0],["，","",0],["对","duì",0],["方","fāng",0],["图","tú",1],["穷","qióng",1],["匕","bǐ",1],["见","xiàn",1],["，","",0],["提","tí",0],["出","chū",0],["了","le",0],["真","zhēn",0],["正","zhèng",0],["的","de",0],["要","yāo",0],["求","qiú",0],["。","",0]],"ja":"交渉が最後になって、相手はついに本性をあらわし、本当の要求を出してきた。","plain":"谈判到了最后，对方图穷匕见，提出了真正的要求。"},{"t":[["他","tā",0],["一","yì",0],["开","kāi",0],["始","shǐ",0],["很","hěn",0],["客","kè",0],["气","qi",0],["，","",0],["后","hòu",0],["来","lái",0],["图","tú",1],["穷","qióng",1],["匕","bǐ",1],["见","xiàn",1],["，","",0],["原","yuán",0],["来","lái",0],["是","shì",0],["想","xiǎng",0],["借","jiè",0],["钱","qián",0],["。","",0]],"ja":"彼は最初はとてもていねいだったが、あとで本当の目的が分かった。お金を借りたかったのだ。","plain":"他一开始很客气，后来图穷匕见，原来是想借钱。"},{"t":[["骗","piàn",0],["子","zi",0],["说","shuō",0],["了","le",0],["半","bàn",0],["天","tiān",0],["好","hǎo",0],["话","huà",0],["，","",0],["最","zuì",0],["后","hòu",0],["图","tú",1],["穷","qióng",1],["匕","bǐ",1],["见","xiàn",1],["，","",0],["让","ràng",0],["老","lǎo",0],["人","rén",0],["把","bǎ",0],["钱","qián",0],["转","zhuǎn",0],["给","gěi",0],["他","tā",0],["。","",0]],"ja":"詐欺師は長いあいだうまいことを言って、最後に本性をあらわし、お年寄りにお金を振り込ませようとした。","plain":"骗子说了半天好话，最后图穷匕见，让老人把钱转给他。"}],"cmp":[["原形毕露","yuán xíng bì lù","正体がすっかりばれる。話し言葉でも使う"],["真相大白","zhēn xiàng dà bái","真相が明らかになる。悪い意味はない"]],"not になるための試験・<b>科挙（かきょ）<\/b>を受けに行くことになり、同じ村の人から「うちの息子もいっしょに連れて行ってください」とたのまれました。","合格者の名前がはり出されました。孫山の名前は、<b>名簿のいちばん最後<\/b>にありました。ぎりぎり合格です。村の人の息子の名前は、ありませんでした。","孫山が先に村に帰ると、その父親が「うちの子はどうでしたか」と聞きに来ました。「落ちました」とは言いにくい孫山は、詩の形で答えました。「合格者の名簿の最後は孫山です。<b>ご子息の名前は、孫山のもっと外にあります。<\/b>」"],"use":["「落ちた」「不合格」をはっきり言わない、<b>やわらかくて上品な言い方<\/b>。","入学試験・資格試験・コンテストなど、えらばれる場面で使う。","「不幸名落孙山」「再次名落孙山」のように使う。"],"ex":[{"t":[["他","tā",0],["去","qù",0],["年","nián",0],["高","gāo",0],["考","kǎo",0],["名","míng",1],["落","luò",1],["孙","sūn",1],["山","shān",1],["，","",0],["今","jīn",0],["年","nián",0],["又","yòu",0],["考","kǎo",0],["了","le",0],["一","yí",0],["次","cì",0],["，","",0],["终","zhōng",0],["于","yú",0],["成","chéng",0],["功","gōng",0],["了","le",0],["。","",0]],"ja":"彼は去年大学入試に落ちたが、今年もう一度受けて、ついに合格した。","plain":"他去年高考名落孙山，今年又考了一次，终于成功了。"},{"t":[["虽","suī",0],["然","rán",0],["这","zhè",0],["次","cì",0],["名","míng",1],["落","luò",1],["孙","sūn",1],["山","shān",1],["，","",0],["但","dàn",0],["是","shì",0],["他","tā",0],["并","bìng",0],["没","méi",0],["有","yǒu",0],["灰","huī",0],["心","xīn",0],["。","",0]],"ja":"今回は不合格だったけれども、彼は少しもがっかりしていない。","plain":"虽然这次名落孙山，但是他并没有灰心。"},{"t":[["参","cān",0],["加","jiā",0],["考","kǎo",0],["试","shì",0],["的","de",0],["有","yǒu",0],["一","yì",0],["千","qiān",0],["多","duō",0],["人","rén",0],["，","",0],["大","dà",0],["部","bù",0],["分","fen",0],["都","dōu",0],["名","míng",1],["落","luò",1],["孙","sūn",1],["山","shān",1],["了","le",0],["。","",0]],"ja":"試験を受けたのは千人以上いて、大部分は不合格だった。","plain":"参加考试的有一千多人，大部分都名落孙山了。"}],"cmp":[["榜上无名","bǎng shàng wú míng","合格者の名簿に名前がない。ほぼ同じ意味"],["金榜题名","jīn bǎng tí míng","反対：合格する。受験生へのお祝いの言葉"]],"note":["孫山本人は<b>合格している<\/b>。「孫山が落ちた」ではなく「孫山より後ろに落ちた」。"],"tip":"最後の合格者が孫山。その後ろ＝不合格。","no":25,"ch":1}]},{"n":2,"title":"寓話・たとえ話から生まれた成語","zh":"寓言故事","sub":"思想家たちが人を説得するために使った、短い笑い話とたとえ話","groups":[{"id":"orokana","ja":"おろかな人の話","zh":"愚人的故事","desc":"「こんな人がいました」という笑い話。思想家が王や弟子を説得するために使った"},{"id":"doubutsu","ja":"動物のたとえ","zh":"动物的比喻","desc":"きつね・とら・かえる・ロバなどが出てくるたとえ話"},{"id":"jinsei","ja":"人生の教え・その他","zh":"人生的道理","desc":"ものの見方・生き方を教える話、けんそんの言葉など"}],"items":[{"id":"shouzhu","g":"orokana","stars":1,"tone":"贬","pat":"守株待兔","py":"shǒu zhū dài tù","mean":"努力しないで、偶然の幸運を待つ","jp":"株（くいぜ）を守りて兎を待つ・待ちぼうけ","chars":[{"w":"守株待兔","cs":[["守","shǒu","見はる・守る"],["株","zhū","木の切りかぶ"],["待","dài","待つ"],["兔","tù","うさぎ"]],"sum":"切りかぶを見はって、うさぎを待つ"}],"src":"戦国時代（前3世紀）｜『韓非子』五蠹","story":["宋（そう）の国に、一人の農夫がいました。畑の中に、木の切りかぶが一つありました。ある日、<b>一匹のうさぎが走ってきて切りかぶにぶつかり、首を折って死にました<\/b>。農夫は、何もしないでうさぎを手に入れました。","「これはいい。毎日ここで待っていれば、毎日うさぎが手に入る。」農夫はすきを捨てて畑仕事をやめ、<b>毎日切りかぶのそばで待ちました<\/b>。","しかし、うさぎは二度と来ませんでした。畑は草だらけになり、農夫は国中の笑いものになりました。この話を書いた韓非（かんぴ）は、「昔うまくいったやり方を、そのまま今の政治に使おうとする人は、この農夫と同じだ」と言っています。"],"use":["<b>けなし言葉<\/b>。①何もせずチャンスを待つ人、②古い経験にこだわる人、の両方に使う。","「不能守株待兔」（待っているだけではだめ）の形が多い。","警察などが犯人を「待ちぶせする」意味でも使い、このときは悪い意味はない。"],"ex":[{"t":[["机","jī",0],["会","huì",0],["要","yào",0],["自","zì",0],["己","jǐ",0],["去","qù",0],["找","zhǎo",0],["，","",0],["不","bù",0],["能","néng",0],["在","zài",0],["家","jiā",0],["里","li",0],["守","shǒu",1],["株","zhū",1],["待","dài",1],["兔","tù",1],["。","",0]],"ja":"チャンスは自分でさがしに行くものだ。家でじっと待っていてはいけない。","plain":"机会要自己去找，不能在家里守株待兔。"},{"t":[["找","zhǎo",0],["工","gōng",0],["作","zuò",0],["不","bù",0],["能","néng",0],["守","shǒu",1],["株","zhū",1],["待","dài",1],["兔","tù",1],["，","",0],["要","yào",0],["主","zhǔ",0],["动","dòng",0],["去","qù",0],["投","tóu",0],["简","jiǎn",0],["历","lì",0],["。","",0]],"ja":"仕事さがしは待っているだけではだめで、自分から進んで履歴書を出さなければならない。","plain":"找工作不能守株待兔，要主动去投简历。"},{"t":[["警","jǐng",0],["察","chá",0],["在","zài",0],["门","mén",0],["口","kǒu",0],["守","shǒu",1],["株","zhū",1],["待","dài",1],["兔","tù",1],["，","",0],["终","zhōng",0],["于","yú",0],["抓","zhuā",0],["住","zhù",0],["了","le",0],["小","xiǎo",0],["偷","tōu",0],["。","",0]],"ja":"警察は入り口で待ちぶせして、ついにどろぼうをつかまえた。","plain":"警察在门口守株待兔，终于抓住了小偷。"}],"cmp":[["坐享其成","zuò xiǎng qí chéng","自分は何もせず、他人の成果だけ受け取る"],["刻舟求剑","kè zhōu qiú jiàn","状況が変わったのに気づかない。「待つ」意味はない"]],"note":["日本の童謡「待ちぼうけ」はこの話をもとにしている。","「株」は株式ではなく、木の切りかぶ。"],"tip":"うさぎは一度しかぶつからない。同じ幸運は二度来ない。","no":26,"ch":2},{"id":"kezhou","g":"orokana","stars":1,"tone":"贬","pat":"刻舟求剑","py":"kè zhōu qiú jiàn","mean":"状況が変わったのに、古いやり方にこだわる","jp":"舟に刻みて剣を求む","chars":[{"w":"刻舟求剑","cs":[["刻","kè","きざむ・しるしをつける"],["舟","zhōu","船"],["求","qiú","さがす・もとめる"],["剑","jiàn","剣"]],"sum":"船にしるしをきざんで、剣をさがす"}],"src":"戦国時代末（前3世紀）｜『呂氏春秋』察今","story":["楚（そ）の国の人が、船で川を渡っていました。船が川のまん中まで来たとき、<b>持っていた剣を水の中に落としてしまいました<\/b>。","その人はあわてず、すぐに小刀を出して、船のへりにしるしをきざみました。「<b>私の剣は、ここから落ちたのだ<\/b>。」まわりの人はふしぎに思いましたが、その人は安心した顔をしています。","船が岸に着いて止まると、その人は、しるしをつけた所から水に入って剣をさがしました。もちろん、見つかりません。<b>船は進んだのに、剣は落ちた場所から動いていない<\/b>からです。この本は「時代が変わったのに、昔の法律で国を治めるのは、これと同じだ」と言っています。"],"use":["<b>けなし言葉<\/b>。時代・市場・状況の変化に合わせない、かたい考え方を批判する。","「不能刻舟求剑」「这不是刻舟求剑吗？」の形が多い。","ビジネスや政策の話でよく使われる。"],"ex":[{"t":[["时","shí",0],["代","dài",0],["变","biàn",0],["了","le",0],["，","",0],["还","hái",0],["用","yòng",0],["十","shí",0],["年","nián",0],["前","qián",0],["的","de",0],["办","bàn",0],["法","fǎ",0],["，","",0],["那","nà",0],["不","bú",0],["是","shì",0],["刻","kè",1],["舟","zhōu",1],["求","qiú",1],["剑","jiàn",1],["吗","ma",0],["？","",0]],"ja":"時代は変わったのに、まだ十年前の方法を使うなんて、それは「船にしるしをつけて剣をさがす」のと同じではないか。","plain":"时代变了，还用十年前的办法，那不是刻舟求剑吗？"},{"t":[["市","shì",0],["场","chǎng",0],["每","měi",0],["天","tiān",0],["都","dōu",0],["在","zài",0],["变","biàn",0],["化","huà",0],["，","",0],["刻","kè",1],["舟","zhōu",1],["求","qiú",1],["剑","jiàn",1],["是","shì",0],["做","zuò",0],["不","bu",0],["好","hǎo",0],["生","shēng",0],["意","yi",0],["的","de",0],["。","",0]],"ja":"市場は毎日変わっている。古いやり方にこだわっていては商売はうまくいかない。","plain":"市场每天都在变化，刻舟求剑是做不好生意的。"},{"t":[["我","wǒ",0],["们","men",0],["不","bù",0],["能","néng",0],["刻","kè",1],["舟","zhōu",1],["求","qiú",1],["剑","jiàn",1],["，","",0],["要","yào",0],["根","gēn",0],["据","jù",0],["新","xīn",0],["情","qíng",0],["况","kuàng",0],["改","gǎi",0],["变","biàn",0],["计","jì",0],["划","huà",0],["。","",0]],"ja":"私たちは古いやり方にこだわってはいけない。新しい状況に合わせて計画を変えなければならない。","plain":"我们不能刻舟求剑，要根据新情况改变计划。"}],"cmp":[["墨守成规","mò shǒu chéng guī","古いきまりをかたく守って変えない"],["随机应变","suí jī yìng biàn","反対：その場の状況に合わせてうまく対応する"]],"note":["「舟」と「船」は同じ意味。成語では古い言葉の「舟」を使う（破釜沉舟も同じ）。"],"tip":"しるしは船といっしょに動く。剣は動かない。","no":27,"ch":2},{"id":"bamiao","g":"orokana","stars":1,"tone":"贬","pat":"拔苗助长","py":"bá miáo zhù zhǎng","mean":"早く結果を出そうとあせって、かえってだめにする","jp":"「助長」の語源","chars":[{"w":"拔苗助长","cs":[["拔","bá","引っぱる・ぬく"],["苗","miáo","なえ"],["助","zhù","助ける"],["长","zhǎng","育つ・のびる"]],"sum":"なえを引っぱって、育つのを助ける"}],"src":"戦国時代（前4世紀）｜『孟子』公孫丑上","story":["宋（そう）の国に、一人の農夫がいました。自分の畑のなえが、なかなか大きくならないのが心配でたまりません。毎日畑に見に行きますが、きのうと同じに見えます。","ある日、農夫はいいことを思いつきました。畑に入り、<b>なえを一本一本、少しずつ上に引っぱった<\/b>のです。朝から夕方までかかって、くたくたになって家に帰り、家族に言いました。「今日はつかれた。<b>なえがのびるのを助けてやった<\/b>よ。」","息子がおどろいて畑に走って行くと、なえはもう全部かれていました。孟子（もうし）は弟子に、「心を育てるには時間がかかる。むりに引っぱってはいけない」と教えるために、この話をしました。"],"use":["<b>けなし言葉<\/b>。とくに<b>子どもの教育<\/b>（早すぎる勉強・つめこみ）について、とてもよく使う。","古い形は「揠苗助长（yà miáo zhù zhǎng）」。今は「拔」がふつう。","「长」は zhǎng（育つ）。cháng（長い）ではない。"],"ex":[{"t":[["让","ràng",0],["三","sān",0],["岁","suì",0],["的","de",0],["孩","hái",0],["子","zi",0],["每","měi",0],["天","tiān",0],["学","xué",0],["习","xí",0],["五","wǔ",0],["个","gè",0],["小","xiǎo",0],["时","shí",0],["，","",0],["这","zhè",0],["是","shì",0],["拔","bá",1],["苗","miáo",1],["助","zhù",1],["长","zhǎng",1],["。","",0]],"ja":"三歳の子どもに毎日五時間勉強させるのは、なえを引っぱるようなもので逆効果だ。","plain":"让三岁的孩子每天学习五个小时，这是拔苗助长。"},{"t":[["学","xué",0],["外","wài",0],["语","yǔ",0],["要","yào",0],["慢","màn",0],["慢","màn",0],["来","lái",0],["，","",0],["拔","bá",1],["苗","miáo",1],["助","zhù",1],["长","zhǎng",1],["反","fǎn",0],["而","ér",0],["没","méi",0],["有","yǒu",0],["好","hǎo",0],["处","chu",0],["。","",0]],"ja":"外国語の勉強はゆっくりやるべきで、あせってむりをするとかえってよくない。","plain":"学外语要慢慢来，拔苗助长反而没有好处。"},{"t":[["父","fù",0],["母","mǔ",0],["太","tài",0],["着","zháo",0],["急","jí",0],["，","",0],["常","cháng",0],["常","cháng",0],["会","huì",0],["拔","bá",1],["苗","miáo",1],["助","zhù",1],["长","zhǎng",1],["。","",0]],"ja":"親があせりすぎると、よく子どもにむりをさせてだめにしてしまう。","plain":"父母太着急，常常会拔苗助长。"}],"cmp":[["急于求成","jí yú qiú chéng","早く成功しようとあせる。結果がだめになる意味はない"],["循序渐进","xún xù jiàn jìn","反対：順番どおりに、少しずつ進む"]],"note":["日本語の「助長する」は今「悪い傾向を強める」の意味だが、中国語の「助长」も同じく悪いことに使う（助长不良风气）。"],"tip":"なえは引っぱっても育たない。子どもも同じ。","no":28,"ch":2},{"id":"yaner","g":"orokana","stars":1,"tone":"贬","pat":"掩耳盗铃","py":"yǎn ěr dào líng","mean":"自分で自分をだます。かくせないことを、かくしたつもりになる","jp":"耳を掩（おお）いて鐘を盗む","chars":[{"w":"掩耳盗铃","cs":[["掩","yǎn","おおう・ふさぐ"],["耳","ěr","耳"],["盗","dào","ぬすむ"],["铃","líng","すず・ベル"]],"sum":"耳をふさいで、すずをぬすむ"}],"src":"戦国時代末（前3世紀）｜『呂氏春秋』自知","story":["春秋時代、晋（しん）の国の貴族・范（はん）氏がほろびたとき、ある男がその家に入って、りっぱな<b>鐘（かね）<\/b>をぬすもうとしました。しかし、鐘は大きくて重く、背負って運ぶことができません。","男は、つちで鐘をわって、小さくして運ぼうと考えました。つちでたたくと、「ゴーン」と大きな音がひびきます。男はびっくりしました。「人に聞かれたら、鐘を取られてしまう。」そこで男は、<b>急いで自分の耳をふさぎました<\/b>。","自分に聞こえなければ、他の人にも聞こえないと思ったのです。もとは「鐘」の話でしたが、後に小さな「すず（铃）」に変わり、今の形になりました。"],"use":["<b>けなし言葉<\/b>。問題を見ないふりをする、ばれているのにごまかす、という行動に使う。","「只是掩耳盗铃」「真是掩耳盗铃」の形が多い。","他人をだますのではなく<b>自分をだます<\/b>ところがポイント。"],"ex":[{"t":[["把","bǎ",0],["成","chéng",0],["绩","jì",0],["单","dān",0],["藏","cáng",0],["起","qǐ",0],["来","lai",0],["不","bú",0],["让","ràng",0],["父","fù",0],["母","mǔ",0],["看","kàn",0],["，","",0],["只","zhǐ",0],["是","shì",0],["掩","yǎn",1],["耳","ěr",1],["盗","dào",1],["铃","líng",1],["。","",0]],"ja":"成績表をかくして親に見せないのは、自分をごまかしているだけだ。","plain":"把成绩单藏起来不让父母看，只是掩耳盗铃。"},{"t":[["问","wèn",0],["题","tí",0],["已","yǐ",0],["经","jīng",0],["很","hěn",0],["严","yán",0],["重","zhòng",0],["了","le",0],["，","",0],["假","jiǎ",0],["装","zhuāng",0],["看","kàn",0],["不","bu",0],["见","jiàn",0],["是","shì",0],["掩","yǎn",1],["耳","ěr",1],["盗","dào",1],["铃","líng",1],["。","",0]],"ja":"問題はもうとても深刻なのに、見えないふりをするのは自分をだましているだけだ。","plain":"问题已经很严重了，假装看不见是掩耳盗铃。"},{"t":[["他","tā",0],["以","yǐ",0],["为","wéi",0],["删","shān",0],["除","chú",0],["了","le",0],["记","jì",0],["录","lù",0],["就","jiù",0],["没","méi",0],["人","rén",0],["知","zhī",0],["道","dao",0],["，","",0],["真","zhēn",0],["是","shì",0],["掩","yǎn",1],["耳","ěr",1],["盗","dào",1],["铃","líng",1],["。","",0]],"ja":"彼は記録を消せばだれにも分からないと思っている。まったく「耳をふさいですずをぬすむ」だ。","plain":"他以为删除了记录就没人知道，真是掩耳盗铃。"}],"cmp":[["自欺欺人","zì qī qī rén","自分をだまし、人もだます。意味を直接言う言葉"],["此地无银三百两","cǐ dì wú yín sān bǎi liǎng","「ここに銀300両はありません」と書いてかくす＝かくそうとしてばら 300人なら口パクでもばれない。ソロになったら逃げるしかない。","no":31,"ch":2},{"id":"huashe","g":"orokana","stars":1,"tone":"贬","pat":"画蛇添足","py":"huà shé tiān zú","mean":"よけいなことをして、かえって悪くする","jp":"蛇足（だそく）の語源","chars":[{"w":"画蛇添足","cs":[["画","huà","絵をかく"],["蛇","shé","へび"],["添","tiān","つけ加える"],["足","zú","足"]],"sum":"へびをかいて、足をつけ加える"}],"src":"戦国時代｜『戦国策』斉策二","story":["楚（そ）の国のある家で、お祭りのあと、主人が手伝いの人たちに酒を一つぼあたえました。みんなで飲むには少なく、一人で飲めばたっぷりあります。そこで相談しました。「地面にへびの絵をかこう。<b>いちばん早くかき終わった人が、この酒を飲む<\/b>ことにしよう。」","一人の男がまっ先にかき終わりました。酒のつぼを左手に持ち、ほかの人がまだかいているのを見て、とくいになって言いました。「<b>私は足までかけるぞ<\/b>。」そして右手でへびに足をかきはじめました。","足をかき終わらないうちに、別の男がへびをかき上げ、つぼをうばって言いました。「<b>へびに足はない<\/b>。足をかいたら、それはへびではない。」そして酒を飲んでしまいました。"],"use":["<b>けなし言葉<\/b>。文章・デザイン・説明などで「それはいらない」と言うときに使う。","「有点儿画蛇添足」「再加就是画蛇添足」の形が多い。","日本語の「蛇足ですが…」のように、自分の話の前置きに使うこともできる（少しかたい）。"],"ex":[{"t":[["这","zhè",0],["幅","fú",0],["画","huà",0],["已","yǐ",0],["经","jīng",0],["很","hěn",0],["好","hǎo",0],["了","le",0],["，","",0],["再","zài",0],["加","jiā",0],["东","dōng",0],["西","xi",0],["就","jiù",0],["是","shì",0],["画","huà",1],["蛇","shé",1],["添","tiān",1],["足","zú",1],["。","",0]],"ja":"この絵はもう十分よいので、これ以上何かを加えたら蛇足だ。","plain":"这幅画已经很好了，再加东西就是画蛇添足。"},{"t":[["他","tā",0],["又","yòu",0],["解","jiě",0],["释","shì",0],["了","le",0],["一","yí",0],["遍","biàn",0],["，","",0],["真","zhēn",0],["是","shì",0],["画","huà",1],["蛇","shé",1],["添","tiān",1],["足","zú",1],["，","",0],["反","fǎn",0],["而","ér",0],["让","ràng",0],["大","dà",0],["家","jiā",0],["更","gèng",0],["不","bù",0],["明","míng",0],["白","bai",0],["了","le",0],["。","",0]],"ja":"彼はもう一度説明したが、まったくの蛇足で、かえってみんなをもっと分からなくさせた。","plain":"他又解释了一遍，真是画蛇添足，反而让大家更不明白了。"},{"t":[["文","wén",0],["章","zhāng",0],["最","zuì",0],["后","hòu",0],["一","yí",0],["段","duàn",0],["有","yǒu",0],["点","diǎnr",0],["儿","",0],["画","huà",1],["蛇","shé",1],["添","tiān",1],["足","zú",1],["，","",0],["删","shān",0],["掉","diào",0],["更","gèng",0],["好","hǎo",0],["。","",0]],"ja":"文章の最後の段落は少し蛇足なので、けずったほうがよい。","plain":"文章最后一段有点儿画蛇添足，删掉更好。"}],"cmp":[["多此一举","duō cǐ yì jǔ","よけいなことをする。話し言葉でよく使う"],["画龙点睛","huà lóng 走。速いほど遠くなる。","no":33,"ch":2},{"id":"qiren","g":"orokana","stars":1,"tone":"贬","pat":"杞人忧天","py":"Qǐ rén yōu tiān","mean":"必要のない心配をする","jp":"杞憂（きゆう）の語源","chars":[{"w":"杞人忧天","cs":[["杞","Qǐ","杞（小さな国の名前）"],["人","rén","人"],["忧","yōu","心配する"],["天","tiān","空・天"]],"sum":"杞の国の人が、天のことを心配する"}],"src":"戦国時代｜『列子』天瑞","story":["杞（き）という小さな国に、一人の男がいました。男は「<b>もし天が落ちてきて、地面がくずれたら、自分はどこにいればいいのだろう<\/b>」と心配で心配で、夜はねむれず、ごはんも食べられなくなりました。","その様子を心配した友だちが、説明しに行きました。「天は空気が集まったものだ。君は一日中、空気の中で息をして動いている。落ちてくるわけがない。」男は言います。「では、太陽や月や星は落ちてこないか。」「あれも空気の中で光っているものだ。落ちても、けがはしないよ。」","「地面がくずれたらどうする。」「地面は土がつまったものだ。君は毎日その上を歩いている。くずれるはずがない。」男はやっと安心して、大よろこびしました。"],"use":["<b>けなし言葉<\/b>。心配しすぎの人に「大丈夫だよ」と言うときに使う。","「不用杞人忧天」「别杞人忧天了」の形が多い。","「不是杞人忧天」（心配は的はずれではなかった）という否定の形もよく使う。"],"ex":[{"t":[["飞","fēi",0],["机","jī",0],["很","hěn",0],["安","ān",0],["全","quán",0],["，","",0],["你","nǐ",0],["不","bú",0],["用","yòng",0],["杞","qǐ",1],["人","rén",1],["忧","yōu",1],["天","tiān",1],["。","",0]],"ja":"飛行機はとても安全だから、よけいな心配はしなくていい。","plain":"飞机很安全，你不用杞人忧天。"},{"t":[["明","míng",0],["天","tiān",0],["的","de",0],["事","shì",0],["明","míng",0],["天","tiān",0],["再","zài",0],["说","shuō",0],["，","",0],["别","bié",0],["杞","qǐ",1],["人","rén",1],["忧","yōu",1],["天","tiān",1],["了","le",0],["。","",0]],"ja":"明日のことは明日考えればいい。取りこし苦労はやめなさい。","plain":"明天的事明天再说，别杞人忧天了。"},{"t":[["事","shì",0],["实","shí",0],["证","zhèng",0],["明","míng",0],["，","",0],["我","wǒ",0],["们","men",0],["的","de",0],["担","dān",0],["心","xīn",0],["不","bú",0],["是","shì",0],["杞","qǐ",1],["人","rén",1],["忧","yōu",1],["天","tiān",1],["。","",0]],"ja":"私たちの心配が取りこし苦労ではなかったことは、事実が証明した。","plain":"事实证明，我们的担心不是杞人忧天。"}],"cmp":[["庸人自扰","yōng rén zì rǎo","つまらない人が自分で問題を作ってなやむ"],["杯弓蛇影","bēi gōng shé yǐng","ないものをあると思ってこわがる。うたがい深さに重点"]],"note":["日本語は「杞憂」と2字にちぢめるが、中国語では4字のまま使う。「杞忧」とはふつう言わない。"],"tip":"空が落ちてくる心配より、明日の宿題の心配を。","no":34,"ch":2},{"id":"handan","g":"orokana","stars":2,"tone":"贬","pat":"邯郸学步","py":"Hándān xué bù","mean":"人のまねをして身につかず、自分のよさまでなくす","jp":"邯鄲の歩み","chars":[{"w":"邯郸学步","cs":[["邯郸","Hándān","邯鄲（趙の都。今の河北省の町）"],["学","xué","学ぶ・まねる"],["步","bù","歩き方"]],"sum":"邯鄲で歩き方を学ぶ"}],"src":"戦国時代（前4〜3世紀）｜『荘子』秋水","story":["戦国時代、趙（ちょう）の都・<b>邯鄲（かんたん）<\/b>は、にぎやかでおしゃれな大都会でした。邯鄲の人は歩き方まで美しい、と有名でした。","北の燕（えん）の国のいなかに、一人の若者がいました。「自分も邯鄲の人のようにかっこよく歩きたい」と思い、遠い邯鄲まで歩き方を習いに行きました。町で人々の歩き方をじっと見て、足の出し方、手のふり方を一つ一つまねしました。","しかし、何か月たっても邯鄲の歩き方はできるようになりません。そのうえ、<b>自分がもともとどう歩いていたかも忘れてしまいました<\/b>。若者はしかたなく、地面をはって国に帰ったということです。"],"use":["<b>けなし言葉<\/b>。外国や他社のやり方をそのまままねして、失敗するときに使う。","「不能邯郸学步」の形が多い。","「まねが下手」だけでなく、<b>もとのよさまで失う<\/b>ところがポイント。"],"ex":[{"t":[["学","xué",0],["习","xí",0],["别","bié",0],["人","rén",0],["的","de",0],["经","jīng",0],["验","yàn",0],["是","shì",0],["好","hǎo",0],["事","shì",0],["，","",0],["但","dàn",0],["不","bù",0],["能","néng",0],["邯","hán",1],["郸","dān",1],["学","xué",1],["步","bù",1],["，","",0],["丢","diū",0],["了","le",0],["自","zì",0],["己","jǐ",0],["的","de",0],["特","tè",0],["点","diǎn",0],["。","",0]],"ja":"ほかの人の経験を学ぶのはよいことだが、ただまねをして自分の特色をなくしてはいけない。","plain":"学习别人的经验是好事，但不能邯郸学步，丢了自己的特点。"},{"t":[["写","xiě",0],["文","wén",0],["章","zhāng",0],["只","zhǐ",0],["模","mó",0],["仿","fǎng",0],["别","bié",0],["人","rén",0],["，","",0],["结","jié",0],["果","guǒ",0],["只","zhǐ",0],["会","huì",0],["是","shì",0],["邯","hán",1],["郸","dān",1],["学","xué",1],["步","bù",1],["。","",0]],"ja":"文章を書くのに人のまねばかりしていると、結局は自分のよさまでなくすだけだ。","plain":"写文章只模仿别人，结果只会是邯郸学步。"},{"t":[["这","zhè",0],["家","jiā",0],["公","gōng",0],["司","sī",0],["邯","hán",1],["郸","dān",1],["学","xué",1],["步","bù",1],["，","",0],["把","bǎ",0],["自","zì",0],["己","jǐ",0],["原","yuán",0],["来","lái",0],["的","de",0],["优","yōu",0],["势","shì",0],["也","yě",0],["丢","diū",0],["了","le",0],["。","",0]],"ja":"この会社は他社のまねをして、自分のもとの強みまでなくしてしまった。","plain":"这家公司邯郸学步，把自己原来的优势也丢了。"}],"cmp":[["东施效颦","Dōng Shī xiào pín","まねをしてかえってみにくくなる。「もとを失う」意味はない"],["生搬硬套","shēng bān yìng tào","状況を考えず、そのまま当てはめる"]],"note":["邯郸は今もある町の名前（河北省邯郸市）。町には「学步桥」という橋がある。"],"tip":"新しい歩き方は身につかず、古い歩き方は忘れた。帰りはハイハイ。","no":35,"ch":2},{"id":"dongshi","g":"orokana","stars":2,"tone":"贬","pat":"东施效颦","py":"Dōng Shī xiào pín","mean":"自分 "蛇","shé","へび"],["影","yǐng","かげ"]],"sum":"さかずきの中の弓のかげが、へびに見える"}],"src":"西晋（3世紀）｜『晋書』楽広伝","story":["晋の時代、<b>楽広（がくこう）<\/b>という役人がいました。仲のよい友人が、長いあいだ遊びに来ません。わけをたずねると、友人は言いました。「前にお宅でお酒をいただいたとき、<b>さかずきの中に小さなへびが見えた<\/b>のです。気持ちが悪かったのですが、飲んでしまいました。それから病気になったのです。」","楽広は考えました。あの日、友人がすわっていた場所のかべには、<b>弓<\/b>がかけてあり、弓にはうるしでへびの絵がかいてありました。","楽広はもう一度友人を呼び、同じ場所にすわらせて酒をつぎました。「さかずきの中に、何か見えますか。」「前と同じです。へびが見えます。」楽広はかべの弓を指さしました。「<b>それは、あの弓のかげですよ。<\/b>」友人はすべてが分かり、重かった病気は、たちまちなおりました。"],"use":["<b>けなし言葉<\/b>。病気・人間関係などで、理由もなくうたがってこわがる人に使う。","「太杯弓蛇影了」「有点儿杯弓蛇影」と、形容詞のように使える。","やや書き言葉。会話では「疑神疑鬼」のほうが多い。"],"ex":[{"t":[["身","shēn",0],["体","tǐ",0],["有","yǒu",0],["一","yì",0],["点","diǎnr",0],["儿","",0],["不","bù",0],["舒","shū",0],["服","fu",0],["就","jiù",0],["觉","jué",0],["得","de",0],["是","shì",0],["大","dà",0],["病","bìng",0],["，","",0],["你","nǐ",0],["太","tài",0],["杯","bēi",1],["弓","gōng",1],["蛇","shé",1],["影","yǐng",1],["了","le",0],["。","",0]],"ja":"体が少しぐあいが悪いだけで大きな病気だと思うなんて、あなたはうたがいすぎだ。","plain":"身体有一点儿不舒服就觉得是大病，你太杯弓蛇影了。"},{"t":[["他","tā",0],["被","bèi",0],["骗","piàn",0],["过","guo",0],["一","yí",0],["次","cì",0],["，","",0],["现","xiàn",0],["在","zài",0],["看","kàn",0],["谁","shéi",0],["都","dōu",0],["像","xiàng",0],["坏","huài",0],["人","rén",0],["，","",0],["有","yǒu",0],["点","diǎnr",0],["儿","",0],["杯","bēi",1],["弓","gōng",1],["蛇","shé",1],["影","yǐng",1],["。","",0]],"ja":"彼は一度だまされたことがあって、今はだれを見ても悪い人に見える。少しうたがいすぎだ。","plain":"他被骗过一次，现在看谁都像坏人，有点儿杯弓蛇影。"},{"t":[["没","méi",0],["有","yǒu",0],["证","zhèng",0],["据","jù",0],["就","jiù",0],["不","bú",0],["要","yào",0],["怀","huái",0],["疑","yí",0],["别","bié",0],["人","rén",0],["，","",0],["别","bié",0],["杯","bēi",1],["弓","gōng",1],["蛇","shé",1],["影","yǐng",1],["。","",0]],"ja":"証拠がないのに人をうたがってはいけない。何でもないことをこわがるのはやめなさい。","plain":"没有证据就不要怀疑别人，别杯弓蛇影。"}],"cmp":[["疑神疑鬼","yí shén yí guǐ","何でもうたがう。話し言葉でよく使う"],["草木皆兵","cǎo mù jiē bīng","草や木がみんな敵の兵に見える。おびえきっている"]],"note":["似た話は、もっと古い後漢の本『風俗通義』にもある。"],"tip":"へびはいない。あるのは弓のかげと、自分のうたがう心。","no":48,"ch":2},{"id":"banmen","g":"jinsei","stars":2,"tone":"贬"   h+=`<div class="card"><div class="sec" style="margin-top:0">今の使い方</div><ul class="pl">${it.use.map(u=>`<li>${u}</li>`).join("")}</ul>`;
  h+=`<div class="sec">例文</div>${it.ex.map(e=>`<div class="ex"><div class="body"><div class="exzh zh" lang="zh-CN">${ruby(e.t)}</div><div class="ja" data-act="ja">${esc(e.ja)}</div></div><button class="spk" data-act="spk" data-t="${esc(e.plain)}" aria-label="読み上げ">▶</button></div>`).join("")}`;
  h+=`<div class="sec">似た言葉・反対の言葉</div><table class="cmp">${it.cmp.map(([w,p,d])=>`<tr><th><span class="zh" lang="zh-CN">${w}</span><small>${p}</small></th><td>${d}</td></tr>`).join("")}</table>`;
  h+=`<div class="sec">使い方の注意・豆知識</div><ul class="pl">${it.note.map(u=>`<li>${u}</li>`).join("")}</ul><div class="tip"><span>覚え方</span>${it.tip}</div></div>`;
  if(idx==c.items.length-1){const last=c.n==D.chaps.length;
    h+=`<div class="chend"><div class="m">ここまでが第${c.n}章（${c.title}・${c.items.length}項目）です${last?`<br>ここまでで全${D.chaps.length}章が終わりです`:""}</div><button class="btn" data-act="chquiz" data-n="${c.n}">第${c.n}章のクイズに挑戦</button>${last?`<button class="btn sub" data-act="tab" data-v="quick">早見表で復習</button>`:`<button class="btn sub" data-act="gotoch" data-n="${c.n+1}">第${c.n+1}章へ進む</button>`}</div>`}
  if(S.from=="quiz")h+=`<div class="pn"><button data-act="backquiz">クイズに戻る ›</button></div>`;
  else h+=`<div class="pn"><button data-act="open" data-id="${ai>0?ALL[ai-1].id:""}" ${ai>0?"":"disabled"}>‹ 前</button><button data-act="tab" data-v="list">一覧</button><button data-act="open" data-id="${ai<ALL.length-1?ALL[ai+1].id:""}" ${ai<ALL.length-1?"":"disabled"}>次 ›</button></div>`;
  return h}
const names=ids=>ids.split(" ").map(i=>`<a href="#${i}" class="zh" style="color:var(--indigo)">${BY[i].pat}</a>`).join("、");
function vIntro(){const n=S.ch,c=chOf(n);let h=`<div class="where"><span>第${n}章　${c.title}</span><span>章のまえに</span></div><div class="card">`;
  if(n==1){h+=`<h2 class="pt">成語（チョンユー）とは</h2><p><b>成語（${zh("成语")} chéngyǔ）</b>は、昔から決まった形で使われてきた短い言葉です。ほとんどが漢字4字で、日本語の「四字熟語」にあたりますが、中国語では会話・ニュース・作文で、日本語よりずっとよく使われます。</p><p>このノートでは<b>「物語から生まれた成語」</b>を50集めました。4つの字を見ても意味が分からず、もとの話を知ってはじめて分かるものです。中国の子どもは、教科書や絵本でこれらの話を読んで育ちます。</p>
<div class="rule"><i>1</i><div><b>形は変えない。</b>字を入れかえたり変えたりしない。4字で一つの単語と考える。</div></div>
<div class="rule"><i>2</i><div><b>字の意味は古い中国語。</b>${zh("亡")}＝なくす、${zh("假")}＝借りる、${zh("见")}＝あらわれる、${zh("之")}＝の（今の${zh("的")}）。</div></div>
<div class="rule"><i>3</i><div><b>ほめ言葉か、けなし言葉か</b>が決まっている（${zh("褒义")} bāoyì・${zh("贬义")} biǎnyì）。意味の左のラベルで確認する。</div></div>
<div class="rule"><i>4</i><div><b>文の中では動詞・形容詞・名詞のように使う。</b>「${zh("真是")}＋成語」「成語＋${zh("的")}＋名詞」「${zh("不能")}＋成語」が多い。</div></div>
<h3 class="ps">時代の流れと、この章の成語</h3><table><tr><th>時代</th><th>どんな時代か／成語</th></tr>${D.timeline.map(([a,b,d,ids])=>`<tr><th>${a}<span class="cpy">${b}</span></th><td>${d}<br>${names(ids)}</td></tr>`).join("")}</table><p class="note">※日本は、秦の統一のころが弥生時代、三国時代が卑弥呼のころ、唐が奈良・平安時代にあたります。</p>`}
  else{h+=`<h2 class="pt">寓話（ぐうわ）とは</h2><p><b>寓話（${zh("寓言")} yùyán）</b>は、教えをふくんだ短いたとえ話です。この章の成語の多くは、<b>戦国時代</b>（前5〜前3世紀）の思想家たちの本から生まれました。</p><p>当時、思想家や説客は、王の前で自分の考えを説明する必要がありました。王に「あなたはまちがっている」と言うのは危険です。そこで<b>「こんなおろかな人がいました」という短い話</b>で、遠回しに、しかし分かりやすく説得したのです。</p>
<div class="rule"><i>1</i><div><b>話は短く、落ちがある。</b>もとの文章はたいてい50〜100字ほど。</div></div>
<div class="rule"><i>2</i><div><b>ほとんどがけなし言葉。</b>人に向かって使うときは注意。自分に使えばけんそん・反省になる。</div></div>
<div class="rule"><i>3</i><div><b>おろかな人は「宋（そう）の国の人」が多い。</b>宋はほろびた殷（いん）王朝の子孫の国で、笑い話の主人公にされやすかったと言われる。</div></div>
<h3 class="ps">出典の本と、この章の成語</h3><table><tr><th>本</th><th>どんな本か／成語</th></tr>${D.sources.map(([a,p,j,d,ids])=>`<tr><th>${p?zh(a):a}<span class="cpy">${p}</span></th><td>${j}：${d}<br>${names(ids)}</td></tr>`).join("")}</table>`}
  h+=`</div><div class="pn"><button data-act="tab" data-v="list">一覧</button><button data-act="open" data-id="${c.items[0].id}">最初の項目へ ›</button></div>`;return h}
function vQuick(){let h=`<h2 class="pt">似ている成語のちがい</h2>`;
  h+=D.pairs.map(([a,b,t])=>`<div class="pair"><div class="h zh"><a href="#${a}">${BY[a].pat}</a><span>と</span><a href="#${b}">${BY[b].pat}</a></div>${t}</div>`).join("");
  h+=`<h2 class="pt" style="margin-top:22px">日本語と意味・使い方がちがう成語</h2><table><tr><th>成語</th><th>日本語では</th><th>中国語では</th></tr>${D.jpdiff.map(([w,p,j,c,id])=>`<tr class="qrow" data-act="open" data-id="${id}"><th><span class="zh" lang="zh-CN">${w}</span></th><td>${j}</td><td>${c}</td></tr>`).join("")}</table>`;
  for(const c of D.chaps){h+=`<h2 class="pt" style="margin-top:22px">第${c.n}章　一覧</h2><table>${c.items.map(i=>`<tr class="qrow" data-act="open" data-id="${i.id}"><td>${i.no}</td><td class="qp zh" lang="zh-CN">${i.pat}<span class="cpy">${i.py}</span></td><td><span class="tone t${i.tone}" style="font-size:10px;margin-right:4px">${TONE[i.tone]}</span>${esc(i.mean)}</td></tr>`).join("")}</table>`}
  return h+`<p class="note">行をタップすると解説に移動します。</p>`}
function vFav(){const l=ALL.filter(i=>fav.has(i.id));return `<h2 class="pt">お気に入り（${l.length}）</h2>`+(l.map(row).join("")||'<div class="empty">一覧や解説の ★ をタップすると、ここに集まります。</div>')+(l.length?`<div style="text-align:center;margin-top:12px"><button class="btn" data-act="favquiz">★だけでクイズ</button></div>`:"")}
const conflict=(a,b)=>D.conflict.some(s=>s.includes(a)&&s.includes(b));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function startQuiz(scope,n){let pool=scope=="all"?ALL:scope=="fav"?ALL.filter(i=>fav.has(i.id)):scope=="wrong"?ALL.filter(i=>wrong.has(i.id)):chOf(+scope).items;
  if(!pool.length){S.quiz={empty:scope};return}
  const qs=shuffle(pool).slice(0,n).map(it=>{const e=it.ex[Math.floor(Math.random()*it.ex.length)];
    const cand=shuffle(chOf(it.ch).items.filter(o=>o.id!=it.id&&!conflict(it.id,o.id))).slice(0,3);
    return {it,e,opts:shuffle([it,...cand]),pick:null}});
  S.quiz={qs,i:0,done:false}}
function vQuiz(){const Q=S.quiz;
  if(!Q||Q.empty){const sc=[["all","全部"],["1","第1章"],["2","第2章"],["fav","★だけ"],["wrong",`間違えた問題（${wrong.size}）`]];
    return `<h2 class="pt">クイズ</h2>${Q&&Q.empty?`<div class="card note">${Q.empty=="fav"?"お気に入りがまだありません。":"間違えた問題はありません。"}</div>`:""}<div class="card"><div class="bt">範囲</div><div class="seg">${sc.map(([v,l])=>`<button class="${set.qs==v?"on":""}" data-act="qs" data-v="${v}">${l}</button>`).join("")}</div><div class="bt">問題数</div><div class="seg">${[10,20,30].map(v=>`<button class="${set.qn==v?"on":""}" data-act="qn" data-v="${v}">${v}問</button>`).join("")}</div><div style="text-align:center"><button class="btn" data-act="qstart">スタート</button></div></div><p class="note">和訳をヒントに、例文の空欄に入る成語を4つの中からえらびます。</p>`}
  if(Q.done){const ok=Q.qs.filter(q=>q.pick==q.it.id).length,ng=Q.qs.filter(q=>q.pick!=q.it.id);
    return `<h2 class="pt">結果</h2><div class="card"><div class="res">${ok}／${Q.qs.length}</div><div style="text-align:center;margin-top:8px"><button class="btn" data-act="qagain">もう一度</button><button class="btn sub" data-act="qreset">範囲をえらぶ</button></div></div>`+(ng.length?`<div class="gh">見直す項目</div>`+ng.map(q=>row(q.it)).join(""):`<div class="empty">全問正解です！</div>`)}
  const q=Q.qs[Q.i],fi=q.e.t.findIndex(t=>t[2]),pre=q.e.t.slice(0,fi).map(t=>esc(t[0])).join(""),post=q.e.t.slice(fi+4).map(t=>esc(t[0])).join(""),ans=q.pick!=null;
  let h=`<div class="prog"><span>第 ${Q.i+1} 問／${Q.qs.length}</span><button data-act="qreset" style="color:var(--muted)">やめる</button></div><div class="card qcard"><div class="hint">${esc(q.e.ja)}</div><div class="qzh zh" lang="zh-CN">${ans?ruby(q.e.t):`${pre}<span class="blank">？</span>${post}`}</div></div>`;
  h+=q.opts.map(o=>`<button class="opt zh ${ans?(o.id==q.it.id?"ok":o.id==q.pick?"ng":""):""}" lang="zh-CN" data-act="pick" data-id="${o.id}" ${ans?"disabled":""}>${o.pat}</button>`).join("");
  if(ans)h+=`<div class="card" style="margin-top:12px"><b style="color:${q.pick==q.it.id?"var(--good)":"var(--acc)"}">${q.pick==q.it.id?"正解！":"ざんねん…"}</b>　${zh(q.it.pat)}：${esc(q.it.mean)}<div style="margin-top:8px"><button class="btn sub" data-act="spk" data-t="${esc(q.e.plain)}">▶ 読み上げ</button><button class="btn sub" data-act="qexp" data-id="${q.it.id}">解説を見る</button><button class="btn" data-act="qnext">${Q.i==Q.qs.length-1?"結果を見る":"次の問題 ›"}</button></div></div>`;
  return h}
function render(keep){const v=S.view;main.innerHTML=v=="detail"?vDetail():v=="intro"?vIntro():v=="quick"?vQuick():v=="quiz"?vQuiz():v=="fav"?vFav():vList();
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v==(v=="detail"||v=="intro"?"list":v)));
  if(!keep)window.scrollTo(0,0);
  const q=$("#q");if(q)q.addEventListener("input",e=>{S.q=e.target.value;const p=e.target.selectionStart;render(true);const n=$("#q");n.focus();try{n.setSelectionRange(p,p)}catch(_){}})}
function go(view,o){Object.assign(S,{view},o||{});const h=view=="detail"?"#"+S.id:"";try{if(location.hash!=h)history.replaceState(null,"",h||location.pathname+location.search)}catch(e){}render()}
function toggleFav(id){fav.has(id)?fav.delete(id):fav.add(id);store.set("fav",[...fav])}
document.addEventListener("click",e=>{
  const a=e.target.closest("a[href^='#']");if(a){const id=a.getAttribute("href").slice(1);if(BY[id]){e.preventDefault();go("detail",{id,from:null})}return}
  const el=e.target.closest("[data-act]");if(!el)return;const d=el.dataset;
  switch(d.act){
    case"tgpy":set.py=!set.py;applySet();break;
    case"tgja":set.hide=!set.hide;applySet();break;
    case"ja":el.classList.toggle("show");break;
    case"tab":if(d.v=="quiz"&&S.quiz&&S.quiz.empty)S.quiz=null;go(d.v,{q:""});break;
    case"ch":S.ch=+d.n;set.ch=S.ch;store.set("set",set);render();break;
    case"gotoch":S.ch=+d.n;set.ch=S.ch;store.set("set",set);go("list");break;
    case"intro":S.ch=+d.n;go("intro");break;
    case"fav":e.stopPropagation();toggleFav(d.id);render(true);break;
    case"spk":e.stopPropagation();speak(d.t);break;
    case"open":if(d.id)go("detail",{id:d.id,from:null});break;
    case"qs":set.qs=d.v;store.set("set",set);render(true);break;
    case"qn":set.qn=+d.v;store.set("set",set);render(true);break;
    case"qstart":case"qagain":startQuiz(set.qs,set.qn);go("quiz");break;
    case"chquiz":set.qs=String(d.n);startQuiz(set.qs,set.qn);go("quiz");break;
    case"favquiz":set.qs="fav";startQuiz("fav",set.qn);go("quiz");break;
    case"qreset":S.quiz=null;go("quiz");break;
    case"pick":{const q=S.quiz.qs[S.quiz.i];q.pick=d.id;if(d.id==q.it.id)wrong.delete(q.it.id);else wrong.add(q.it.id);store.set("wrong",[...wrong]);render(true);break}
    case"qnext":if(S.quiz.i==S.quiz.qs.length-1)S.quiz.done=true;else S.quiz.i++;render();break;
    case"qexp":go("detail",{id:d.id,from:"quiz"});break;
    case"backquiz":if(S.quiz&&!S.quiz.done){if(S.quiz.i==S.quiz.qs.length-1)S.quiz.done=true;else S.quiz.i++}go("quiz");break;
  }});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.classList&&e.target.classList.contains("row"))e.target.click()});
function fromHash(){const id=location.hash.slice(1);if(BY[id]){S.view="detail";S.id=id;S.from=null;S.ch=BY[id].ch}else if(S.view=="detail")S.view="list";render()}
window.addEventListener("hashchange",fromHash);
applySet();fromHash();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
